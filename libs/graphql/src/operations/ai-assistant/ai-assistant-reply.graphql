subscription AiAssistantReply(
  $conversationId: ID!
  $content: String!
  $pagePath: String
  $temperature: Float
) {
  aiAssistantReply(
    conversationId: $conversationId
    content: $content
    pagePath: $pagePath
    temperature: $temperature
  ) {
    conversationId
    messageId
    delta
    done
    toolName
    action {
      id
      type
      title
    }
  }
}
