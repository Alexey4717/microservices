syntax = "proto3";

package auth;

service AuthService {
  rpc Register (RegisterRequest) returns (AuthResponse);
  rpc Login (LoginRequest) returns (AuthResponse);
  rpc OauthUpsert (OauthUpsertRequest) returns (AuthResponse);
  rpc Refresh (RefreshRequest) returns (AuthResponse);
  rpc Logout (LogoutRequest) returns (Empty);
  rpc GetMe (GetMeRequest) returns (UserResponse);
  rpc UpdateMe (UpdateMeRequest) returns (UserResponse);
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string name = 3;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message OauthUpsertRequest {
  string provider = 1;
  string provider_account_id = 2;
  string email = 3;
  string name = 4;
  string avatar_url = 5;
}

message RefreshRequest {
  string refresh_token = 1;
}

message LogoutRequest {
  string refresh_token = 1;
}

message GetMeRequest {}

message UpdateMeRequest {
  optional string name = 1;
  optional string avatar_url = 2;
}

message UserResponse {
  string id = 1;
  string email = 2;
  string name = 3;
  string avatar_url = 4;
  string account_tier = 5;
}

message AuthResponse {
  string access_token = 1;
  string refresh_token = 2;
  UserResponse user = 3;
}

message Empty {}
