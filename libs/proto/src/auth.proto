syntax = "proto3";

package auth;

service AuthService {
  rpc Register (RegisterRequest) returns (AuthResponse);
  rpc Login (LoginRequest) returns (AuthResponse);
  rpc OauthUpsert (OauthUpsertRequest) returns (AuthResponse);
  rpc Refresh (RefreshRequest) returns (AuthResponse);
  rpc Logout (LogoutRequest) returns (Empty);
  rpc GetMe (GetMeRequest) returns (UserResponse);
  rpc UpdateMe (UpdateMeRequest) returns (UserResponse);
  rpc GetMeByTelegram (GetMeByTelegramRequest) returns (UserResponse);
  rpc CreateTelegramLinkToken (CreateTelegramLinkTokenRequest) returns (CreateTelegramLinkTokenResponse);
  rpc ConsumeTelegramLinkToken (ConsumeTelegramLinkTokenRequest) returns (UserResponse);
  rpc UpsertTelegramProfile (UpsertTelegramProfileRequest) returns (UserResponse);
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string name = 3;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message OauthUpsertRequest {
  string provider = 1;
  string provider_account_id = 2;
  string email = 3;
  string name = 4;
  string avatar_url = 5;
}

message RefreshRequest {
  string refresh_token = 1;
}

message LogoutRequest {
  string refresh_token = 1;
}

message GetMeRequest {}

message UpdateMeRequest {
  optional string name = 1;
  optional string avatar_url = 2;
}

message TelegramProfile {
  string user_id = 1;
  string username = 2;
  string first_name = 3;
  string last_name = 4;
  string photo_url = 5;
}

message UserResponse {
  string id = 1;
  string email = 2;
  string name = 3;
  string avatar_url = 4;
  string account_tier = 5;
  TelegramProfile telegram = 6;
}

message AuthResponse {
  string access_token = 1;
  string refresh_token = 2;
  UserResponse user = 3;
}

message GetMeByTelegramRequest {
  string telegram_id = 1;
}

message CreateTelegramLinkTokenRequest {}

message CreateTelegramLinkTokenResponse {
  string token = 1;
}

message ConsumeTelegramLinkTokenRequest {
  string telegram_id = 1;
  string token = 2;
}

message UpsertTelegramProfileRequest {
  string telegram_id = 1;
  string username = 2;
  string first_name = 3;
  string last_name = 4;
  optional string photo_url = 5;
}

message Empty {}
