<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Заметка</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main>
      <p id="empty" hidden>Заметка доступна на странице ролика</p>
      <form id="editor" hidden>
        <p id="video-label"></p>
        <label for="note">Заметка к ролику</label>
        <textarea id="note" name="note"></textarea>
        <button type="submit">Сохранить</button>
        <p id="status"></p>
      </form>
    </main>
    <script src="sidepanel.js"></script>
  </body>
</html>
